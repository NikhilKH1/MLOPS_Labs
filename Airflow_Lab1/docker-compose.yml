services:
  airflow:
    build:
      context: .
      args:
        AIRFLOW_VERSION: "3.1.8"
    command: standalone
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "5"
      PIPELINE_ARTIFACT_ROOT: /opt/airflow/artifacts
      SKLEARN_DATA: /opt/airflow/artifacts/.cache/scikit-learn
      MPLCONFIGDIR: /tmp/matplotlib
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - ./artifacts:/opt/airflow/artifacts
      - airflow-state:/opt/airflow
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/v2/monitor/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  tests:
    build:
      context: .
      args:
        AIRFLOW_VERSION: "3.1.8"
    profiles: ["test"]
    working_dir: /opt/airflow/project
    command: python -m pytest -q
    environment:
      AIRFLOW_HOME: /tmp/airflow-test
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - .:/opt/airflow/project:ro

volumes:
  airflow-state:
